name: CI

# Verifies the site builds before Netlify ships it to crossbellvending.com.
# Netlify remains the deploy mechanism: it builds from main on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match netlify.toml's NODE_VERSION so a green CI means a green deploy.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check expected pages were generated
        run: |
          for f in dist/index.html dist/machines/index.html dist/contact/index.html dist/404.html dist/sitemap-index.xml; do
            test -s "$f" || { echo "::error::missing or empty build output: $f"; exit 1; }
          done
          echo "All expected pages present."
