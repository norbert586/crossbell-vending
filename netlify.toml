[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Kept in sync with .github/workflows/ci.yml and package.json engines.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
